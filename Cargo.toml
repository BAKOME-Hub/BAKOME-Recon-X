[package]
name = "bakome-recon-x"
version = "4.0.0"
edition = "2021"
description = "Ultimate bug bounty recon & pentest framework in pure Rust – V4 COLOSSUS"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
regex = "1"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
